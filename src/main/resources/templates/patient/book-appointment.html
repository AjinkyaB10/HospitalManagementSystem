<!-- patient/book-appointment.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-info">
    <div class="container">
        <a class="navbar-brand" th:href="@{/patient/dashboard}">Patient Panel</a>
        <a class="btn btn-light btn-sm" th:href="@{/patient/dashboard}">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">Book Appointment</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/patient/book-appointment}" th:object="${appointment}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label">Doctor</label>
                    <select class="form-select" name="doctorId" required>
                        <option value="">Select Doctor</option>
                        <option th:each="doctor : ${doctors}"
                                th:value="${doctor.id}"
                                th:text="${doctor.user.name + ' - ' + doctor.specialization}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input class="form-control" type="date" th:field="*{appointmentDate}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Time</label>
                    <input class="form-control" type="time" th:field="*{appointmentTime}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Symptoms</label>
                    <textarea class="form-control" th:field="*{symptoms}" rows="4"></textarea>
                </div>

                <button class="btn btn-info text-white" type="submit">Book Appointment</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
