<!-- patient/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-info">
    <div class="container">
        <a class="navbar-brand" th:href="@{/patient/dashboard}">Patient Panel</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/patient/book-appointment}">Book Appointment</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/patient/appointments}">Appointments</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/patient/profile}">Profile</a>
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow border-0">
        <div class="card-body p-4">
            <h2 class="text-info" th:text="'Welcome, ' + ${patient.user.name}">Welcome Patient</h2>
            <p><strong>Total Appointments:</strong> <span th:text="${appointments.size()}"></span></p>
            <a th:href="@{/patient/book-appointment}" class="btn btn-info text-white">Book Appointment</a>
        </div>
    </div>
</div>
</body>
</html>
