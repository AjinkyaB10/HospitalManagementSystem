<!-- patient/appointments.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Appointments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-info">
    <div class="container">
        <a class="navbar-brand" th:href="@{/patient/dashboard}">Patient Panel</a>
        <a class="btn btn-light btn-sm" th:href="@{/patient/dashboard}">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-info mb-3">My Appointments</h2>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-info">
                <tr>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Symptoms</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="appointment : ${appointments}">
                    <td th:text="${appointment.doctor.user.name}">Doctor Name</td>
                    <td th:text="${appointment.appointmentDate}">2026-06-11</td>
                    <td th:text="${appointment.appointmentTime}">10:00</td>
                    <td th:text="${appointment.symptoms}">Symptoms</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${appointment.status}">PENDING</span>
                    </td>
                    <td>
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/patient/appointments/cancel/{id}(id=${appointment.id})}">
                            Cancel
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="6" class="text-center text-muted">
                        You have not booked any appointments yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
