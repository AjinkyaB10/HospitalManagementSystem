<!-- patient/profile.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-info">
    <div class="container">
        <a class="navbar-brand" th:href="@{/patient/dashboard}">Patient Panel</a>
        <a class="btn btn-light btn-sm" th:href="@{/patient/dashboard}">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">Update Patient Profile</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/patient/profile}" th:object="${patient}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input class="form-control" type="text" th:field="*{phone}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input class="form-control" type="number" th:field="*{age}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Blood Group</label>
                    <input class="form-control" type="text" th:field="*{bloodGroup}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" th:field="*{address}" rows="4"></textarea>
                </div>

                <button class="btn btn-info text-white" type="submit">Update Profile</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
