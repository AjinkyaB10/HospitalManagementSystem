<!-- admin/doctors.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Panel</a>
        <a class="btn btn-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary">Doctors</h2>
        <a class="btn btn-success" th:href="@{/admin/doctors/add}">Add Doctor</a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-primary">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Specialization</th>
                    <th>Experience</th>
                    <th>Fees</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doctor : ${doctors}">
                    <td th:text="${doctor.user.name}"></td>
                    <td th:text="${doctor.user.email}"></td>
                    <td th:text="${doctor.specialization}"></td>
                    <td th:text="${doctor.experience}"></td>
                    <td th:text="${doctor.fees}"></td>
                    <td>
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/admin/doctors/delete/{id}(id=${doctor.id})}"
                           onclick="return confirm('Delete this doctor?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(doctors)}">
                    <td colspan="6" class="text-center text-muted">No doctors added yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
