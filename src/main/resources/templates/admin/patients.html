<!-- admin/patients.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Panel</a>
        <a class="btn btn-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-primary mb-3">Patients</h2>
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-primary">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Age</th>
                    <th>Blood Group</th>
                    <th>Address</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="patient : ${patients}">
                    <td th:text="${patient.user != null ? patient.user.name : 'Unknown'}"></td>
                    <td th:text="${patient.user != null ? patient.user.email : 'No linked user'}"></td>
                    <td th:text="${patient.phone}"></td>
                    <td th:text="${patient.age}"></td>
                    <td th:text="${patient.bloodGroup}"></td>
                    <td th:text="${patient.address}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(patients)}">
                    <td colspan="6" class="text-center text-muted">No patients registered yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
