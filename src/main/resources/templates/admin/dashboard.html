<!-- admin/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Panel</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/admin/doctors}">Doctors</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/admin/patients}">Patients</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/admin/appointments}">Appointments</a>
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4 text-primary">Admin Dashboard</h2>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow text-center border-0">
                <div class="card-body">
                    <h5>Total Doctors</h5>
                    <h1 class="text-primary" th:text="${totalDoctors}">0</h1>
                    <a th:href="@{/admin/doctors}" class="btn btn-primary">Manage Doctors</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow text-center border-0">
                <div class="card-body">
                    <h5>Total Patients</h5>
                    <h1 class="text-success" th:text="${totalPatients}">0</h1>
                    <a th:href="@{/admin/patients}" class="btn btn-success">View Patients</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow text-center border-0">
                <div class="card-body">
                    <h5>Total Appointments</h5>
                    <h1 class="text-warning" th:text="${totalAppointments}">0</h1>
                    <a th:href="@{/admin/appointments}" class="btn btn-warning">View Appointments</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
