<!-- admin/add-doctor.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Doctor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Panel</a>
        <a class="btn btn-light btn-sm" th:href="@{/admin/doctors}">Back</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Add Doctor</h4>
        </div>
        <div class="card-body">
            <p class="alert alert-danger" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/admin/doctors/add}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Name</label>
                        <input class="form-control" type="text" name="name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" name="email" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input class="form-control" type="password" name="password" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Specialization</label>
                        <input class="form-control" type="text" name="specialization" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Experience</label>
                        <input class="form-control" type="text" name="experience">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Available Days</label>
                        <input class="form-control" type="text" name="availableDays">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Available Time</label>
                        <input class="form-control" type="text" name="availableTime">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fees</label>
                        <input class="form-control" type="number" step="0.01" name="fees">
                    </div>
                </div>

                <button class="btn btn-success" type="submit">Save Doctor</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
