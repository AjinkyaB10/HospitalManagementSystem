<!-- doctor/profile.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" th:href="@{/doctor/dashboard}">Doctor Panel</a>
        <a class="btn btn-light btn-sm" th:href="@{/doctor/dashboard}">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Update Doctor Profile</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/doctor/profile}" th:object="${doctor}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Specialization</label>
                    <input class="form-control" type="text" th:field="*{specialization}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Experience</label>
                    <input class="form-control" type="text" th:field="*{experience}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Available Days</label>
                    <input class="form-control" type="text" th:field="*{availableDays}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Available Time</label>
                    <input class="form-control" type="text" th:field="*{availableTime}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Fees</label>
                    <input class="form-control" type="number" step="0.01" th:field="*{fees}">
                </div>

                <button class="btn btn-success" type="submit">Update Profile</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
