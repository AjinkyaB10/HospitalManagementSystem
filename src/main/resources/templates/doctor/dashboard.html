<!-- doctor/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" th:href="@{/doctor/dashboard}">Doctor Panel</a>
        <div>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/doctor/appointments}">Appointments</a>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/doctor/profile}">Profile</a>
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow border-0">
        <div class="card-body p-4">
            <h2 class="text-success" th:text="'Welcome, Dr. ' + ${doctor.user.name}">Welcome Doctor</h2>
            <p><strong>Specialization:</strong> <span th:text="${doctor.specialization}"></span></p>
            <p><strong>Experience:</strong> <span th:text="${doctor.experience}"></span></p>
            <p><strong>Total Appointments:</strong> <span th:text="${appointments.size()}"></span></p>
            <a th:href="@{/doctor/appointments}" class="btn btn-success">View Appointments</a>
        </div>
    </div>
</div>
</body>
</html>
